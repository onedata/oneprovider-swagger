get:
  operationId: get_rdf_metadata
  x-onedata-gri:
    type: op_file
    id: ?OBJECTID_BINDING(id)
    aspect: rdf_metadata
  summary: Get file RDF metadata
  tags:
    - Custom File Metadata
  x-bash-codegen-description: |
    This method returns the RDF metadata for a file specified by [$FILE_ID](#operation/lookup_file_id).

    If there is no RDF metadata associated with the file, this method returns HTTP 400
    code with `enoent` POSIX error.

  description: |
    This method returns the RDF metadata for a file specified by [$FILE_ID](#operation/lookup_file_id).

    If there is no RDF metadata associated with the file, this method returns HTTP 400
    code with `enoent` POSIX error.

    ***Example cURL requests***

    **Get complete RDF metadata document for file**

    ```bash
    curl -H "X-Auth-Token: $TOKEN" \
    -X GET https://$PROVIDER_HOST/api/v3/oneprovider/data/$FILE_ID/metadata/rdf

    <RDF><homepage>https://www.onedata.org</homepage></RDF>
    ```
  produces:
    - application/rdf+xml
  responses:
    '200':
      description: Rdf metadata.
      schema:
        type: string
        example: <RDF><homepage>https://www.onedata.org</homepage></RDF>
    '400':
      description: No RDF metadata associated with the file or invalid request.
      schema:
        allOf:
          - $ref: '#/definitions/Error'
          - example:
              error:
                id: posix
                details:
                  errno: enodata
                description: 'Operation failed with POSIX error: enodata.'
    '403':
      description: Forbidden request.
      schema:
        $ref: '#/definitions/Error'
    '404':
      description: File not found.
      schema:
        $ref: '#/definitions/Error'
    '500':
      description: Internal server error.
      schema:
        $ref: '#/definitions/Error'
  parameters:
  - name: id
    in: path
    description: Id of the file.
    type: string
    required: true
  - name: resolve_symlink
    in: query
    description: >
      Indicates whether the operation should be performed on the symbolic link itself (`false`)
      or on the target file that it points to (`true`).
    type: boolean
    default: true
  x-code-samples:
  - lang: Shell
    source: "oneprovider-rest-cli getRdfMetadata id=$FILE_ID"


put:
  operationId: set_rdf_metadata
  x-onedata-parse_body: '{as_is, <<"metadata">>}'
  x-onedata-gri:
    type: op_file
    id: ?OBJECTID_BINDING(id)
    aspect: rdf_metadata
  summary: Set file RDF metadata
  tags:
    - Custom File Metadata
  x-bash-codegen-description: |
    This method allows to set specific RDF metadata for a file specified by [$FILE_ID](#operation/lookup_file_id).

    This operation will replace the previous RDF metadata if any.

  description: |
    This method allows to set specific RDF metadata for a file specified by [$FILE_ID](#operation/lookup_file_id).

    This operation will replace the previous RDF metadata if any.

    ***Example cURL requests***

    **Set RDF metadata for space from RDF file**
    ```bash
    curl -H "X-Auth-Token: $TOKEN" \
    -X PUT https://$PROVIDER_HOST/api/v3/oneprovider/data/$FILE_ID/metadata/rdf \
    -H "Content-Type: application/rdf+xml" -d "@./space1_dublincore.rdf"
    ```
  consumes:
    - application/rdf+xml
  responses:
    '204':
      description: Rdf metadata updated successfully.
    '400':
      description: Invalid request.
      schema:
        $ref: '#/definitions/Error'
    '403':
      description: Forbidden request.
      schema:
        $ref: '#/definitions/Error'
    '404':
      description: File not found.
      schema:
        $ref: '#/definitions/Error'
    '500':
      description: Internal server error.
      schema:
        $ref: '#/definitions/Error'
  parameters:
  - name: id
    in: path
    description: Id of the file.
    type: string
    required: true
  - name: metadata
    in: body
    description: The RDF metadata.
    required: true
    schema:
      type: string
  - name: resolve_symlink
    in: query
    description: >
      Indicates whether the operation should be performed on the symbolic link itself (`false`)
      or on the target file that it points to (`true`).
    type: boolean
    default: true
  x-code-samples:
  - lang: Shell
    source: "cat metadata.rdf | oneprovider-rest-cli setRdfMetadata id=$FILE_ID -"


