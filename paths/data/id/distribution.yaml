get:
  operationId: get_data_distribution
  x-onedata-gri:
    type: op_file
    id: ?OBJECTID_BINDING(id)
    aspect: distribution
  tags:
    - Data Distribution
  summary: Get data distribution
  x-bash-codegen-description: |
    Returns information about distribution of a specific file among different storage providers.
    Returned `locationsPerStorage` are the same as returned by [get storage locations](#operation/get_file_storage_locations) 
    endpoint.


  description: |
    Returns information about distribution of a specific file among different storage providers.
    Returned `locationsPerStorage` are the same as returned by [get storage locations](#operation/get_file_storage_locations) 
    endpoint.

    ***Example cURL requests***

    **Get file distribution**
    ```bash
    curl -H "X-Auth-Token: $TOKEN" -X GET "https://$PROVIDER_HOST/api/v3/oneprovider/data/$FILE_ID/distribution"
    
    {
      "type": "REG",
      "distributionPerProvider": {
        "$PROVIDER_ID1": {
          "success": true,
          "logicalSize": 8,
          "locationsPerStorage": {
            "$STORAGE_ID": {
              "success": true,
              "location": "/file/location/on/storage"
            }
          },
          "distributionPerStorage": {
            "$STORAGE_ID": {
              "success": true,
              "blocks": [[0,4],[6,2]],
              "physicalSize": 6
            }
          }
        },
        "$PROVIDER_ID2": {
          "success": false,
          "error": {
            "description": "Operation failed with POSIX error: enoent.",
            "details": {"errno":"enoent"}
          }
        },
        "$PROVIDER_ID3": {
          "success": true,
          "logicalSize": 8,
          "locationsPerStorage": {
            "$STORAGE_ID": {
              "success": false,
              "error": {
                "id": "requiresPosixCompatibleStorage",
                "details": {
                  "storageId": "b2ce3858c7267a9c016296e51dc9c41cch3618",
                  "posixCompatibleStorages": ["posix","glusterfs","nfs","nulldevice"]
                },
                "description": "Cannot apply for the storage backend \"b2ce3858c7267a9c016296e51dc9c41cch3618\". This operation requires a POSIX-compatible storage backend (any of: posix, glusterfs, nfs, nulldevice)."
              }
            }
          },
          "distributionPerStorage": {
            "$STORAGE_ID": {
              "success": true,
              "blocks": [[0,4],[6,2]],
              "physicalSize": 6
            }
          }
        },
        "$PROVIDER_ID4": {
          "success": true,
          "logicalSize": 8,
          "locationsPerStorage": {
            "$STORAGE_ID": {
              "success": true,
              "location": null
            }
          },
          "distributionPerStorage": {
            "$STORAGE_ID": {
              "success": true,
              "blocks": [],
              "physicalSize": 0
            }
          }
        },
        "$PROVIDER_ID5": {
          "success": true,
          "logicalSize": null,
          "locationsPerStorage": {
            "$STORAGE_ID": {
              "success": true,
              "location": "/file/location/on/storage"
          },
          "distributionPerStorage": {
            "$STORAGE_ID": {
              "success": false,
              "error": {
                "id": "dirStatsDisabledForSpace",
                "description": "Directory statistics collection is disabled for this space."
              }
            }
          }
        }
      }
    }
    ```
  produces:
    - application/json
  responses:
    '200':
      description: The distribution of the file.
      schema:
        $ref: '#/definitions/DataDistribution'
    '400':
      description: Invalid request.
      schema:
        $ref: '#/definitions/Error'
    '403':
      description: Forbidden request.
      schema:
        $ref: '#/definitions/Error'
    '404':
      description: File not found.
      schema:
        $ref: '#/definitions/Error'
    '500':
      description: Internal server error.
      schema:
        $ref: '#/definitions/Error'
  parameters:
    - name: id
      in: path
      description: The Id of the file
      type: string
      required: true
  x-code-samples:
    - lang: Shell
      source: "oneprovider-rest-cli getDataDistribution id=$FILE_ID"
