get:
  operationId: get_file_storage_locations
  x-onedata-gri:
    type: op_file
    id: ?OBJECTID_BINDING(id)
    aspect: storage_locations
  tags:
    - Data Distribution
  summary: Get file storage locations
  x-bash-codegen-description: |
    Returns information about file location on each storage. `null` value for a storage 
    means that there is no file replica on this storage. 
    Supported for directories and regular files. 
    This endpoint returns subset of data available under [data distribution](#operation/get_data_distribution).


  description: |
    Returns information about file location on each storage. `null` value for a storage 
    means that there is no file replica on this storage. 
    Supported for directories and regular files. 
    This endpoint returns subset of data available under [data distribution](#operation/get_data_distribution).

    ***Example cURL requests***

    **Get file storage locations**
    ```bash
    curl -H "X-Auth-Token: $TOKEN" -X GET "https://$PROVIDER_HOST/api/v3/oneprovider/data/$FILE_ID/storage_locations"

    {
      "locationsPerProvider": {
        "$PROVIDER_ID1": {
          "success": true,
          "locationsPerStorage": {
            "$STORAGE_ID1": {
              "success": "true",
              "location": "path/to/file"
            }
          }
        },
        "$PROVIDER_ID2": {
          "success": true,
          "locationsPerStorage": {
            "$STORAGE_ID2": {
              "success": "true",
              "location": null
            }
          }
        },
        "$PROVIDER_ID3": {
          "success": true,
          "locationsPerStorage": {
            "$STORAGE_ID2": {
              "success": false,
              "error": {
                "id": "requiresPosixCompatibleStorage",
                  "details": {
                    "storageId": "b2ce3858c7267a9c016296e51dc9c41cch3618",
                    "posixCompatibleStorages": ["posix", "glusterfs", "nfs", "nulldevice"]
                  },
                "description": "Cannot apply for the storage backend \"b2ce3858c7267a9c016296e51dc9c41cch3618\". This operation requires a POSIX-compatible storage backend (any of: posix, glusterfs, nfs, nulldevice).",
              }
            }
          }
        }
      }
    }
    ```
  produces:
    - application/json
  responses:
    '200':
      description: Storage file locations.
      schema:
        $ref: '#/definitions/StorageFileLocations'
    '400':
      description: Invalid request.
      schema:
        $ref: '#/definitions/Error'
    '403':
      description: Forbidden request.
      schema:
        $ref: '#/definitions/Error'
    '404':
      description: File not found.
      schema:
        $ref: '#/definitions/Error'
    '500':
      description: Internal server error.
      schema:
        $ref: '#/definitions/Error'
  parameters:
    - name: id
      in: path
      description: The Id of the file
      type: string
      required: true
  x-code-samples:
    - lang: Shell
      source: "oneprovider-rest-cli getFileStorageLocations id=$FILE_ID"
