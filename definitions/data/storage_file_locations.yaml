type: object
description: >
  Describes storage locations of a single file among different storage providers.
properties:
  locationsPerProvider:
    type: object
    additionalProperties:
      type: object
      description: File storage locations for a specific provider.
      properties:
        success:
          type: boolean
          description: Indicates whether fetching file storage locations for this provider was successful.
        locationsPerStorage:
          type: object
          description: >
            Map with file storage location per storage (only when success = true).
          additionalProperties:
            type: string
            description: File storage location for a specific storage.
        error:
          type: object
          description: Error that occurred for this storage (only when `success` = false).
          properties:
            description:
              description: Detailed description of the error.
              type: string
            id:
              description: Id of the error.
              type: string
            details:
              description: Key value map with details describing the error.
              type: object

example:
  locationsPerProvider:
    $PROVIDER_ID1:
      success: true
      locationsPerStorage:
        $STORAGE_ID: "path/to/file"
    $PROVIDER_ID2:
      success: true
      locationsPerStorage:
        $STORAGE_ID: null
    $PROVIDER_ID3:
      success: false
      error:
        id: "requiresPosixCompatibleStorage"
        description: "Cannot apply for the storage backend \"b2ce3858c7267a9c016296e51dc9c41cch3618\". This operation 
          requires a POSIX-compatible storage backend (any of: posix, glusterfs, nfs, nulldevice)."
        details:
          storageId: "$STORAGE_ID"
          posixCompatibleStorages": [
            "posix",
            "glusterfs",
            "nfs",
            "nulldevice"
          ]

