allOf:
  - $ref: '#/definitions/DataDistribution'
  - type: object
    properties:
      distributionPerProvider:
        type: object
        additionalProperties:
          type: object
          description: Data distribution for a specific provider.
          properties:
            success:
              type: boolean
              description: >
                Indicates whether fetching file distribution for this provider was successful.
                If false, the `error` field carries the reason and the rest of the fields are absent. 
                If true, the error field is absent.
            error:
              $ref: '#/definitions/Error'
              description: Error that occurred for this provider.
            logicalSize: 
              type: integer
              description: >
                Total number of bytes in the file content, from the point of view of the Onedata logical namespace. 
                Independent of the file’s distribution or replication.
            locationsPerStorage:
              type: object
              description: >
                Map with file locations per storage.
              additionalProperties:
                type: object
                description: Information about file location on each storage. 
                properties:
                  success:
                    type: boolean
                    description: >
                      Indicates whether fetching file location for this storage was successful. 
                      If false, the `error` field carries the reason and the rest of the fields are absent.
                      If true, the error field is absent.
                  error:
                    $ref: '#/definitions/Error'
                    description: Error that occurred for this storage.
                  location: 
                    type: string
                    description: > 
                      File location on this storage.
                      `null` value for a storage means that there is no file replica on this storage.
            distributionPerStorage:
              type: object
              description: > 
                Map with file distribution per storage.
              additionalProperties: 
                type: object
                description: File distribution for a specific storage.
                properties:
                  success:
                    type: boolean
                    description: >
                      Indicates whether fetching file distribution for this storage was successful. 
                      If false, the `error` field carries the reason and the rest of the fields are absent. 
                      If true, the error field is absent.
                  error:
                    $ref: '#/definitions/Error'
                    description: Error that occurred for this provider.
                  blocks:
                    type: array
                    description: > 
                      A list of blocks in byte ranges stored on this storage.
                    items:
                      type: array
                      description: File block specified as a pair [offset, size].
                      items:
                        type: integer
                      maxItems: 2
                      minItems: 2
                  physicalSize:
                    type: integer
                    description: > 
                      Actual amount of storage consumed to store the file on a given storage backend. May be smaller 
                      than the logical size if the file replica is incomplete.
example:
  type: "REG"
  distributionPerProvider: 
    $PROVIDER_ID1:
      success: true
      logicalSize: 8
      locationsPerStorage:
        $STORAGE_ID: 
          success: true
          location: "/file/location/on/storage"
      distributionPerStorage:
        $STORAGE_ID:
          success: true
          blocks: [[0, 4], [6, 2]]
          physicalSize: 6
    $PROVIDER_ID2:
      success: true
      logicalSize: 8
      locationsPerStorage:
        $STORAGE_ID:
          success: true
          location: null
      distributionPerStorage:
        $STORAGE_ID:
          success: true
          blocks: []
          physicalSize: 0
    $PROVIDER_ID3:
      success: true
      logicalSize: 8
      locationsPerStorage:
        $STORAGE_ID:
          success: false
          error:
            id: "requiresPosixCompatibleStorage"
            description: "Cannot apply for the storage backend \"b2ce3858c7267a9c016296e51dc9c41cch3618\". This operation requires a POSIX-compatible storage backend (any of: posix, glusterfs, nfs, nulldevice)."
            details:
              storageId: "$STORAGE_ID"
              posixCompatibleStorages": ["posix", "glusterfs", "nfs", "nulldevice"]
      distributionPerStorage:
        $STORAGE_ID:
          success: true
          blocks: [[0, 4], [6, 2]]
          physicalSize: 6
    $PROVIDER_ID4:
      success: false
      error:
        description: "Operation failed with POSIX error: enoent."
        details: 
          errno: "enoent"